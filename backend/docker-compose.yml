services:
  postgres:
    image: postgres:16-alpine
    container_name: seti-postgres
    environment:
      POSTGRES_USER: seti
      POSTGRES_PASSWORD: seti
      POSTGRES_DB: seti
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
